<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#101317" />
  <title>Workshop Sandbox</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="3D workshop simulator"></canvas>

    <section id="hud" aria-live="polite">
      <div class="pill"><span>資金</span><strong id="money">¥0</strong></div>
      <div class="pill"><span>売却</span><strong id="sold">0 / 10</strong></div>
      <div class="pill status"><span id="status">読み込み中…</span></div>
    </section>

    <div id="crosshair" aria-hidden="true">+</div>

    <section id="mobileControls" aria-label="タッチ操作">
      <div id="movePad" class="pad" aria-label="移動パッド">
        <div id="moveKnob" class="knob"></div>
      </div>
      <div id="lookPad" aria-label="視点操作エリア"></div>
      <div class="actions">
        <button id="grabBtn" type="button">吸着</button>
        <button id="sellBtn" type="button">投げる</button>
        <button id="buyBtn" type="button">補充 ¥40</button>
      </div>
    </section>

    <section id="desktopHelp">
      WASD: 高速移動 / ドラッグ: 視点 / E: 吸着・離す / R・Space: 投げる / B: 補充
    </section>

    <button id="resetBtn" type="button" class="reset">進行リセット</button>
    <div id="fatal" role="alert" hidden></div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
