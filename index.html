<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Velvet" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png?v=44" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=44" />
  <link rel="manifest" href="./manifest.webmanifest?v=44" />
  <link rel="stylesheet" href="./styles.css?v=48" />
  <link rel="stylesheet" href="./touch-polish.css?v=44" />
  <title>Velvet</title>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section id="privacyGate" class="privacy-gate" aria-label="Privacy gate">
      <div class="privacy-gate__mark">V</div>
      <p class="eyebrow">PRIVATE</p>
      <h1>Velvet</h1>
      <p class="privacy-gate__copy">Tap to reveal</p>
      <button id="unlockButton" class="button button--primary button--wide" type="button">Open</button>
    </section>

    <section id="safeScreen" class="safe-screen is-hidden" aria-label="Hidden screen">
      <div class="safe-screen__time" id="safeTime">--:--</div>
      <p>Focus</p>
      <button id="returnButton" class="button button--ghost" type="button">Return</button>
    </section>

    <section id="mainExperience" class="experience is-hidden">
      <header class="topbar">
        <div>
          <p class="brand">VELVET</p>
          <p id="modeLabel" class="mode-label">FLOW</p>
        </div>
        <div class="topbar__actions">
          <button id="quickHideButton" class="icon-button" type="button" aria-label="Quick hide">◌</button>
          <button id="settingsButton" class="icon-button" type="button" aria-label="Settings">⋯</button>
        </div>
      </header>

      <section id="flowView" class="view view--active" aria-label="Velvet Flow">
        <div id="flowGridShell" class="flow-grid-shell" aria-label="Flow一覧">
          <div id="flowGrid" class="flow-grid"></div>
          <p id="flowGridStatus" class="flow-grid-status muted" aria-live="polite"></p>
          <div id="flowGridSentinel" class="flow-grid-sentinel" aria-hidden="true"></div>
        </div>
        <div id="cardStage" class="card-stage">
          <article id="mediaCard" class="media-card" tabindex="0">
            <div class="media-card__skeleton"></div>
            <img id="mediaImage" alt="" draggable="false" />
            <div class="media-card__shade"></div>
            <div class="media-card__meta">
              <span id="sourceLabel" class="pill">Velvet</span>
              <span id="intensityLabel" class="pill pill--muted">—</span>
            </div>
            <div id="dragLike" class="drag-cue drag-cue--like">戻る</div>
            <div id="dragSkip" class="drag-cue drag-cue--skip">進む</div>
          </article>

          <div id="emptyState" class="empty-state is-hidden">
            <h2>No feed yet</h2>
            <p>The private UI is ready. Connect the same-origin feed adapter or use the built-in demo catalog.</p>
            <button id="retryFeedButton" class="button button--primary" type="button">Retry</button>
          </div>
        </div>

      </section>

    </section>

    <dialog id="settingsDialog" class="settings-dialog">
      <form method="dialog" class="settings-sheet">
        <div class="settings-sheet__head">
          <div>
            <p class="eyebrow">PRIVATE CONTROLS</p>
            <h2>Settings</h2>
          </div>
          <button class="icon-button" value="close" aria-label="Close settings">×</button>
        </div>

        <label class="setting-row">
          <span><b>Privacy Blur</b><small>Conceal content on every launch.</small></span>
          <input id="privacyBlurSetting" type="checkbox" />
        </label>

        <label class="setting-row">
          <span><b>Resume last item</b><small>Default is off.</small></span>
          <input id="resumeSetting" type="checkbox" />
        </label>

        <label class="setting-row">
          <span><b>Reduced Motion</b><small>Reduce swipe and transition animation.</small></span>
          <input id="reducedMotionSetting" type="checkbox" />
        </label>

        <label class="setting-column">
          <span><b>Effects</b><small>Choose visual feedback intensity.</small></span>
          <select id="fxModeSetting">
            <option value="off">OFF</option>
            <option value="standard">STANDARD</option>
            <option value="high" selected>HIGH</option>
          </select>
        </label>
        <div class="settings-actions">
          <button id="fxTestButton" class="button button--primary" type="button">FX TEST</button>
        </div>
        <p id="fxDiagnosticStatus" class="muted settings-status"></p>

        <label class="setting-column">
          <span><b>History Mode</b><small>Preference weights always remain local.</small></span>
          <select id="historyModeSetting">
            <option value="off">Off — no item-level history</option>
            <option value="likes">Likes only</option>
            <option value="full">Full local history</option>
          </select>
        </label>

        <div class="settings-actions">
          <button id="resetTasteButton" class="button button--ghost" type="button">Reset taste</button>
          <button id="clearHistoryButton" class="button button--ghost" type="button">Clear history</button>
          <button id="clearAllButton" class="button button--danger" type="button">Clear all local data</button>
        </div>
        <p id="settingsStatus" class="muted settings-status"></p>
      </form>
    </dialog>
  </main>

  <script type="module" src="./src/privacy-guard.js?v=44"></script>
  <script type="module" src="./src/flow-presets.js?v=49.2"></script>
  <script type="module" src="./src/loading-guard.js?v=44"></script>
  <script type="module" src="./src/fx-settings.js?v=44"></script>
  <script type="module" src="./src/effects-force.js?v=44"></script>
  <script type="module" src="./src/image-guard.js?v=44"></script>
  <script type="module" src="./src/input-guard.js?v=49.4"></script>
  <script type="module" src="./src/app.js?v=49.4"></script>
</body>
</html>
