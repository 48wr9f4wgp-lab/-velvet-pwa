name: Velvet static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js lib/*.js api/*.js sw.js velvet-feed-sync.js; do
            node --check "$file"
          done
          cat feed-base/part-*.txt > /tmp/velvet-feed-base.js
          node --check /tmp/velvet-feed-base.js

      - name: JSON parse
        run: node -e "for (const f of ['manifest.webmanifest','velvet-content.json','package.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON OK')"

      - name: Favorite sync core contracts
        run: |
          node tests/favorite-sync-core.mjs
          node -e "const p=require('./package.json'); if(p.dependencies?.['@vercel/blob']!=='2.6.1') throw new Error('Vercel Blob SDK must stay pinned'); console.log('Favorite sync dependency pin OK')"

      - name: Required PWA files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            index.html styles.css flow-ux.css touch-polish.css manifest.webmanifest sw.js velvet-content.json \
            icons/icon-180.png icons/icon-192.png icons/icon-512.png \
            src/app.js src/content.js src/favorite-archive.js src/flow-presets.js src/input-guard.js src/image-guard.js src/media-viewer.js src/recommender.js src/ui-ja.js; do
            test -f "$file"
          done
          echo "PWA files OK"

      - name: UX regression contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const ja = fs.readFileSync('src/ui-ja.js','utf8');
          const input = fs.readFileSync('src/input-guard.js','utf8');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));

          for (const token of [
            'id="dragLike" class="drag-cue drag-cue--like">戻る<',
            'id="dragSkip" class="drag-cue drag-cue--skip">進む<',
            './styles.css?v=48',
            './src/image-guard.js?v=44',
            './src/flow-presets.js?v=49.2',
            './src/input-guard.js?v=50',
            './src/app.js?v=50'
          ]) {
            if (!html.includes(token)) throw new Error(`index contract missing: ${token}`);
          }
          for (const removed of [
            'id="sessionsButton"',
            'id="sessionSetupView"',
            'id="sessionPlayerView"',
            'id="sessionSummaryView"',
            './src/session-ux.js',
            './src/session-cues.js'
          ]) {
            if (html.includes(removed)) throw new Error(`Session UI still exposed: ${removed}`);
          }
          if (!ja.includes('setText("#dragLike", "戻る")') || !ja.includes('setText("#dragSkip", "進む")')) {
            throw new Error('Japanese legacy cue labels regressed');
          }
          if (input.includes('session') || input.includes('bindFastNavigationGesture')) {
            throw new Error('Session/gesture runtime leaked into Flow-only input guard');
          }
          const sizes = new Set((manifest.icons || []).map(icon => icon.sizes));
          if (!sizes.has('192x192') || !sizes.has('512x512')) throw new Error('Manifest icons incomplete');
          console.log('UX regression contracts OK');
          NODE

      - name: Flow v49.2 contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const flow = fs.readFileSync('src/flow-presets.js','utf8');
          const recommender = fs.readFileSync('src/recommender.js','utf8');
          const app = fs.readFileSync('src/app.js','utf8');
          const content = fs.readFileSync('src/content.js','utf8');

          for (const token of ['おすすめ','人気','新着','すべて','素人','プロ','♡ お気に入り']) {
            if (!flow.includes(token)) throw new Error(`Flow Japanese label missing: ${token}`);
          }
          for (const legacy of ['Soft ·','Personal ·','Intense ·','Explore ·']) {
            if (flow.includes(legacy)) throw new Error(`Legacy Flow label still exposed: ${legacy}`);
          }
          for (const exposed of [
            '{ id: "pinterest", label: "Pinterest" }',
            'filter === "pinterest" ? "Pinterest"',
            'button.textContent = "Pinterest"'
          ]) {
            if (flow.includes(exposed)) throw new Error(`Retired public Pinterest category still exposed: ${exposed}`);
          }
          if (flow.includes('import "./session-ux.js"')) {
            throw new Error('Removed Session runtime still imported through Flow presets');
          }
          for (const token of [
            'velvet_private_v49_pinterest_url',
            'retirePinterestWidgetState',
            'localStorage.setItem(SOURCE_FILTER_KEY, "all")'
          ]) {
            if (!flow.includes(token)) throw new Error(`Pinterest retirement migration missing: ${token}`);
          }
          for (const token of [
            'FLOW_SOURCE_FILTER_KEY',
            'resolved === "popular"',
            'resolved === "latest"',
            'isAmateurItem',
            'isProItem'
          ]) {
            if (!recommender.includes(token)) throw new Error(`Flow recommender contract missing: ${token}`);
          }
          if (!app.includes('"popular", "latest"')) throw new Error('Flow modes popular/latest missing from app');
          if (!app.includes('"velvet:flow-filter"')) throw new Error('Flow filter event missing from app');
          if (!content.includes('X_EPOCH_MS = 1288834974657n')) throw new Error('X post-time derivation missing');
          const feed = JSON.parse(fs.readFileSync('velvet-content.json','utf8'));
          const classCounts = (feed.items || []).reduce((acc, item) => {
            const key = String(item.source_class || 'mixed');
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          }, {});
          if ((classCounts.personal || 0) < 3) throw new Error('Amateur/personal feed class has too few items');
          if ((classCounts.pro || 0) < 3) throw new Error('Pro feed class has too few items');
          console.log('Flow v49.2 static contracts OK', classCounts);
          NODE

          node --input-type=module <<'NODE'
          globalThis.localStorage = {
            values: new Map([
              ['velvet_private_v2_flow_preset', 'popular'],
              ['velvet_private_v3_source_filter', 'amateur']
            ]),
            getItem(key) { return this.values.get(key) ?? null; }
          };
          const { rankCandidates } = await import('./src/recommender.js');
          const state = { likedItemIds: [], recentItemIds: [], recentSources: [], tagWeights: {}, sourceWeights: {}, intensityWeights: {}, sourceClassWeights: {} };
          const catalog = [
            { id:'ama-1', image_url:'a', source:'TGAma', source_class:'personal', tags:['personal'], rank:2, published_at_ms:2000, baseline:null },
            { id:'pro-1', image_url:'b', source:'TGAV1', source_class:'pro', tags:['pro'], rank:1, published_at_ms:3000, baseline:null }
          ];
          let rows = rankCandidates(catalog, state, 'popular', new Set(), null, 10);
          if (rows.length !== 1 || rows[0].item.id !== 'ama-1') throw new Error('Amateur filter leaked pro item');
          localStorage.values.set('velvet_private_v3_source_filter', 'pro');
          rows = rankCandidates(catalog, state, 'popular', new Set(), null, 10);
          if (rows.length !== 1 || rows[0].item.id !== 'pro-1') throw new Error('Pro filter leaked amateur item');
          localStorage.values.set('velvet_private_v2_flow_preset', 'latest');
          localStorage.values.set('velvet_private_v3_source_filter', 'all');
          rows = rankCandidates(catalog, state, 'latest', new Set(), null, 10);
          if (rows[0].item.id !== 'pro-1') throw new Error('Latest ordering is not newest first');
          console.log('Flow v49.2 behavior contracts OK');
          NODE

      - name: Flow grid v49.4 contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const app = fs.readFileSync('src/app.js','utf8');
          const input = fs.readFileSync('src/input-guard.js','utf8');
          const css = fs.readFileSync('flow-ux.css','utf8');

          for (const token of ['id="flowGridShell"','id="flowGrid"','id="flowGridStatus"','id="flowGridSentinel"']) {
            if (!html.includes(token)) throw new Error(`Flow grid DOM missing: ${token}`);
          }
          for (const token of [
            'const FLOW_GRID_BATCH = 12',
            'function refreshFlowGrid',
            'function appendFlowGridBatch',
            'loading = index < 6 ? "eager" : "lazy"',
            'window.dispatchEvent(new CustomEvent("velvet:media-tap", { detail: { scope: "flow" } }))'
          ]) {
            if (!app.includes(token)) throw new Error(`Flow grid app contract missing: ${token}`);
          }
          if (app.includes('bindSwipe(els.mediaCard, navigateFlowBack, navigateFlowNext)')) {
            throw new Error('Legacy Flow swipe deck is still bound in app');
          }
          if (app.includes('window.addEventListener("velvet:flow-next"') || app.includes('window.addEventListener("velvet:flow-back"')) {
            throw new Error('Legacy Flow swipe navigation events are still active');
          }
          for (const removed of [
            'buildSessionQueue',
            'adaptSessionQueue',
            'recordSession',
            'sessionSetupView',
            'sessionPlayerView',
            'sessionSummaryView',
            'sessionsButton'
          ]) {
            if (app.includes(removed)) throw new Error(`Session runtime still present: ${removed}`);
          }
          for (const token of [
            'grid-template-columns: repeat(2, minmax(0, 1fr))',
            '#flowView .card-stage',
            '#flowView.view--active',
            'flex: 1 1 0%'
          ]) {
            if (!css.includes(token)) throw new Error(`Flow grid CSS contract missing: ${token}`);
          }
          const baseCss = fs.readFileSync('styles.css','utf8');
          for (const token of ['height: 100svh','height: 100dvh','max-height: 100dvh']) {
            if (!baseCss.includes(token)) throw new Error(`iOS PWA viewport contract missing: ${token}`);
          }
          console.log('Flow grid v49.4 contracts OK');
          NODE

      - name: Feed visibility v49.6 contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const app = fs.readFileSync('src/app.js','utf8');

          if (!html.includes('./src/app.js?v=50')) throw new Error('v49.6 app cache bust missing');
          if (app.includes('const FLOW_GRID_LIMIT = 160')) throw new Error('Legacy 160-item Flow cap still present');

          for (const token of [
            'const limit = Math.max(1, catalog.length)',
            'function catalogSignature(items)',
            'function refreshCatalogIfChanged()',
            'function scheduleForegroundFeedRefresh()',
            'document.addEventListener("visibilitychange"',
            'awayMs >= 1200',
            '}, 1200);',
            '}, 7000);',
            'catalogSignatureValue = catalogSignature(catalog)',
            'refreshFlowGrid({ preserveCount: true })',
            'velvet:feed-refreshed'
          ]) {
            if (!app.includes(token)) throw new Error(`Feed visibility contract missing: ${token}`);
          }

          const feed = JSON.parse(fs.readFileSync('velvet-content.json','utf8'));
          if ((feed.items || []).length <= 160) {
            console.log('Feed currently <=160 items; cap-removal contract still validated statically');
          } else {
            console.log('Feed exceeds old cap:', feed.items.length);
          }

          console.log('Feed visibility v49.6 contracts OK');
          NODE

      - name: Fullscreen viewer v49.4 contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const app = fs.readFileSync('src/app.js','utf8');
          const viewer = fs.readFileSync('src/media-viewer.js','utf8');
          const input = fs.readFileSync('src/input-guard.js','utf8');
          const css = fs.readFileSync('flow-ux.css','utf8');

          for (const token of [
            './src/input-guard.js?v=50',
            './src/app.js?v=50'
          ]) {
            if (!html.includes(token)) throw new Error(`v49.3 asset version missing: ${token}`);
          }

          for (const token of [
            'id="mediaViewerFavorite"',
            'velvet:flow-toggle-favorite',
            'syncViewerFavoriteButton',
            'aria-pressed',
            'お気に入りに追加',
            'お気に入りから外す'
          ]) {
            if (!viewer.includes(token)) throw new Error(`Fullscreen favorite viewer contract missing: ${token}`);
          }

          for (const token of [
            'window.addEventListener("velvet:flow-toggle-favorite"',
            'toggleFlowGridFavorite(currentItem)',
            'publishFlowItem(currentItem)'
          ]) {
            if (!app.includes(token)) throw new Error(`Fullscreen favorite app bridge missing: ${token}`);
          }

          if (!input.includes('import "./media-viewer.js?v=49.4.1";')) {
            throw new Error('Fullscreen viewer media cache bust missing');
          }

          for (const token of [
            '.media-viewer__actions',
            '.media-viewer__favorite',
            '.media-viewer__favorite.is-saved'
          ]) {
            if (!css.includes(token)) throw new Error(`Fullscreen favorite CSS missing: ${token}`);
          }

          for (const token of [
            'velvet:flow-viewer-navigate',
            'direction: dx < 0 ? "next" : "previous"',
            'Math.abs(dx) >= 56',
            'gesture.zoom <= 1',
            'renderViewerItem(flowItem, { resetZoom: true })',
            'velvet:media-viewer-close',
            '左右スワイプ · ダブルタップ / ピンチで拡大',
            'const activePointers = new Map()',
            'Math.max(1, Math.min(4',
            'moved > 18',
            'now - lastTapAt < 420',
            'Math.hypot(event.clientX - lastTapPoint.x'
          ]) {
            if (!viewer.includes(token)) throw new Error(`Fullscreen swipe viewer contract missing: ${token}`);
          }

          for (const token of [
            'let flowViewerItems = []',
            'flowViewerItems = flowGridItems.slice()',
            'function navigateFlowViewer',
            'window.addEventListener("velvet:flow-viewer-navigate"',
            'function restoreFlowGridPositionFromViewer',
            'card?.scrollIntoView({ block: "center", behavior: "auto" })'
          ]) {
            if (!app.includes(token)) throw new Error(`Fullscreen swipe app contract missing: ${token}`);
          }

          if (!input.includes('./flow-ux.css?v=50')) {
            throw new Error('Fullscreen swipe CSS cache bust missing');
          }

          console.log('Fullscreen viewer v49.4 contracts OK');
          NODE

      - name: Favorite archive v49.5 contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const app = fs.readFileSync('src/app.js','utf8');
          const archive = fs.readFileSync('src/favorite-archive.js','utf8');
          const sw = fs.readFileSync('sw.js','utf8');

          if (!html.includes('./src/app.js?v=50')) throw new Error('v49.5 app cache bust missing');

          for (const token of [
            'archiveFavorite',
            'backfillFavoriteArchive',
            'clearFavoriteArchive',
            'getArchivedFavorites',
            'removeFavoriteArchive',
            'archived.get(id) || byId.get(id)',
            'navigator.serviceWorker.register("./sw.js?v=50")'
          ]) {
            if (!app.includes(token)) throw new Error(`Favorite archive app contract missing: ${token}`);
          }

          for (const token of [
            'velvet_private_v49_5_favorite_archive_meta',
            'velvet-favorite-media-v1',
            'archived_favorite: true',
            'mode: "no-cors"',
            'cache.put(url, response)',
            'navigator.storage.persist()',
            'const MAX_ARCHIVES = 400',
            'await new Promise(resolve => setTimeout(resolve, 40))'
          ]) {
            if (!archive.includes(token)) throw new Error(`Favorite archive storage contract missing: ${token}`);
          }

          for (const token of [
            'const FAVORITE_MEDIA_CACHE = "velvet-favorite-media-v1"',
            'request.destination !== "image"',
            'cache.match(request, { ignoreVary: true })',
            'return fetch(request)'
          ]) {
            if (!sw.includes(token)) throw new Error(`Favorite archive service worker contract missing: ${token}`);
          }

          if (sw.includes('request.destination === "script"') || sw.includes('request.destination === "style"')) {
            throw new Error('Favorite archive service worker must not restore shell cache interception');
          }

          console.log('Favorite archive v49.5 static contracts OK');
          NODE

          node --input-type=module <<'NODE'
          const values = new Map();
          globalThis.localStorage = {
            getItem(key) { return values.get(key) ?? null; },
            setItem(key, value) { values.set(key, String(value)); },
            removeItem(key) { values.delete(key); }
          };
          const cached = new Map();
          globalThis.caches = {
            async open() {
              return {
                async match(url) { return cached.get(String(url)) || undefined; },
                async put(url, response) { cached.set(String(url), response); },
                async delete(url) { return cached.delete(String(url)); }
              };
            },
            async delete() { cached.clear(); return true; }
          };
          globalThis.fetch = async () => new Response('image-bytes', { status: 200 });

          const {
            archiveFavorite,
            getArchivedFavorite,
            getArchivedFavorites,
            removeFavoriteArchive,
            clearFavoriteArchive
          } = await import('./src/favorite-archive.js');

          const item = {
            id: 'fav-1',
            image_url: 'https://example.com/fav.jpg',
            source: 'test',
            source_label: 'Test',
            source_class: 'personal',
            tags: ['one'],
            intensity: 3,
            rank: 1
          };

          archiveFavorite(item);
          const archived = getArchivedFavorite('fav-1');
          if (!archived || archived.image_url !== item.image_url || archived.archived_favorite !== true) {
            throw new Error('Favorite metadata was not archived');
          }
          const rows = getArchivedFavorites(['fav-1']);
          if (rows.length !== 1 || rows[0].id !== 'fav-1') throw new Error('Archived favorite lookup failed');

          removeFavoriteArchive(item, 0);
          await new Promise(resolve => setTimeout(resolve, 10));
          if (getArchivedFavorite('fav-1')) throw new Error('Favorite metadata removal failed');

          await clearFavoriteArchive();
          console.log('Favorite archive v49.5 behavior contracts OK');
          NODE

      - name: Pinterest retirement v49.2 contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const css = fs.readFileSync('flow-ux.css','utf8');
          const input = fs.readFileSync('src/input-guard.js','utf8');

          for (const forbidden of [
            'id="pinterestPanel"',
            'pinterest-embed.js',
            'assets.pinterest.com/js/pinit.js',
            'Pinterestを接続',
            'embedBoard',
            'embedUser'
          ]) {
            if (html.includes(forbidden) || css.includes(forbidden)) {
              throw new Error(`Public Pinterest runtime still exposed: ${forbidden}`);
            }
          }
          if (!input.includes('./flow-ux.css?v=50')) throw new Error('Retirement CSS cache bust missing');
          console.log('Pinterest public widget retired');
          NODE

      - name: Exposure v46.1 contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const engine = fs.readFileSync('feed-base/part-04.txt','utf8')
            + fs.readFileSync('feed-base/part-05.txt','utf8')
            + fs.readFileSync('feed-base/part-06.txt','utf8');
          const content = fs.readFileSync('src/content.js','utf8');
          const recommender = fs.readFileSync('src/recommender-core-v30.js','utf8');
          const sync = fs.readFileSync('velvet-feed-sync.js','utf8');

          for (const token of [
            'exposureBasis = "source-prior"',
            'exposureConfidence = 0.35',
            'intensityFromTier(gate.exposureTier, gate.exposureBasis)',
            'exposure_tier: gate.exposureBasis === "metadata" ? gate.exposureTier : "unknown"',
            'exposure_estimate_tier: gate.exposureTier',
            'exposure_basis: gate.exposureBasis',
            'exposure_confidence:'
          ]) {
            if (!engine.includes(token)) throw new Error(`Exposure engine contract missing: ${token}`);
          }
          for (const token of ['exposure_estimate_tier: estimatedTier','exposure_basis: exposureBasis','exposure_confidence: exposureConfidence']) {
            if (!content.includes(token)) throw new Error(`Catalog exposure contract missing: ${token}`);
          }
          if (!recommender.includes('0.34 * exposureConfidence') || !recommender.includes('0.16 * exposureConfidence')) {
            throw new Error('Exposure confidence weighting missing from recommender');
          }
          if (!sync.includes('"User-Agent": "VelvetFeedSync/1.2.3-public"')
              || !sync.includes('const VERSION = "1.2.3-public";')
              || !sync.includes('Velvet v0.9.6 + Exposure Compatibility 2026-09-19')) {
            throw new Error('Exposure compatibility feed version missing');
          }

          const feed = JSON.parse(fs.readFileSync('velvet-content.json','utf8'));
          if (String(feed.generated_by || '').includes('1.2.3-public')) {
            let profiles = 0;
            let effectiveKnown = 0;
            let priors = 0;
            let unsafePriorTier = 0;
            for (const item of feed.items || []) {
              for (const profile of Object.values(item.baseline?.profiles || {})) {
                profiles += 1;
                const directTier = String(profile.exposure_tier || 'unknown');
                const estimateTier = String(profile.exposure_estimate_tier || 'unknown');
                if (directTier !== 'unknown' || estimateTier !== 'unknown') effectiveKnown += 1;
                if (profile.exposure_basis === 'source-prior') {
                  priors += 1;
                  if (directTier !== 'unknown') unsafePriorTier += 1;
                  if (estimateTier === 'unknown') throw new Error('Source prior missing exposure estimate');
                  if (Number(profile.exposure_confidence) > 0.5) throw new Error('Source prior confidence too high');
                }
              }
            }
            if (profiles < 10) throw new Error('Exposure feed has too few profiles');
            if (effectiveKnown / profiles < 0.8) throw new Error(`Exposure coverage too low: ${effectiveKnown}/${profiles}`);
            if (priors < 1) throw new Error('Exposure recovery produced no source-prior classifications');
            if (unsafePriorTier > 0) throw new Error(`Old-client compatibility leak: ${unsafePriorTier} source priors exposed as direct tiers`);
          }
          console.log('Exposure v46.1 contracts OK');
          NODE

          node --input-type=module <<'NODE'
          const { scoreItem } = await import('./src/recommender-core-v30.js');
          const state = {
            likedItemIds: [], skippedItemIds: [], recentItemIds: [], recentSources: [],
            tagWeights: {}, sourceWeights: {}, intensityWeights: {}, sourceClassWeights: {}
          };
          const base = {
            image_url: 'x', source: 'T', source_class: 'pro', tags: [], intensity: 3,
            baseline: { profiles: { personal: {
              eligible: true, score: 1, run_cap: 3, exposure_tier: 'high',
              intensity: 3, post_jp: false, post_female: false, age_target: false
            } } }
          };
          const direct = { ...base, id: 'direct', baseline: { profiles: { personal: { ...base.baseline.profiles.personal, exposure_confidence: 1 } } } };
          const prior = { ...base, id: 'prior', baseline: { profiles: { personal: { ...base.baseline.profiles.personal, exposure_confidence: 0.35 } } } };
          const directScore = scoreItem(direct, state, 'personal', 3);
          const priorScore = scoreItem(prior, state, 'personal', 3);
          if (!(directScore > priorScore)) throw new Error('Low-confidence source prior is not damped');
          console.log('Exposure confidence behavior OK');
          NODE

      - name: Favorite recovery v50 contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const store = fs.readFileSync('src/store.js','utf8');
          const archive = fs.readFileSync('src/favorite-archive.js','utf8');
          const app = fs.readFileSync('src/app.js','utf8');
          const html = fs.readFileSync('index.html','utf8');

          if (!html.includes('./src/app.js?v=50')) throw new Error('v50 app cache bust missing');
          if (!archive.includes('export function getAllArchivedFavorites()')) {
            throw new Error('Archived favorite enumeration missing');
          }
          if (!app.includes('function recoverArchivedFavoriteState()')) {
            throw new Error('Favorite recovery routine missing');
          }
          if (!app.includes('getAllArchivedFavorites')) {
            throw new Error('Favorite recovery does not read archive');
          }
          if (!app.includes('History cleared · favorites kept')) {
            throw new Error('Clear history UX does not preserve favorites');
          }
          if (app.includes('state = clearHistory(state);\n    void clearFavoriteArchive();')) {
            throw new Error('Clear history still destroys favorite archive');
          }

          const policy = store.match(/export function applyHistoryPolicy\(state\) \{[\s\S]*?\n\}/)?.[0] || '';
          if (policy.includes('state.likedItemIds = []')) {
            throw new Error('History policy still clears favorites');
          }
          const clearHistory = store.match(/export function clearHistory\(state\) \{[\s\S]*?\n\}/)?.[0] || '';
          if (clearHistory.includes('state.likedItemIds = []')) {
            throw new Error('Clear history still clears favorites');
          }
          if (!store.includes('if (reaction === "like") {\n    state.likedItemIds =')) {
            throw new Error('Likes are still gated by history mode');
          }

