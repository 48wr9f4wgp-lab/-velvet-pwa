name: Favorite identity V53 safety
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduction and conservation tests
        run: node --test tests/favorite-identity-regression.test.mjs tests/favorite-v53-safety.test.mjs | tee favorite-v53-results.tap
      - name: Source package for private offline replay
        uses: actions/upload-artifact@v4
        with:
          name: favorite-v53-tested-source
          path: |
            lib/*.js
            src/*.js
            api/favorites-sync.js
            package.json
            tests/favorite-identity-regression.test.mjs
            tests/favorite-v53-safety.test.mjs
            favorite-v53-results.tap
          retention-days: 7
